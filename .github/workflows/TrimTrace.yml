name: TrimTrace

on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "ext/**"
      - "test/**"
      - "trim-check/**"
      - "*.toml"
      - ".github/workflows/TrimTrace.yml"
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  trimtrace:
    name: Public API under --trim=safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
      - name: Install TrimTrace and the package
        run: |
          julia --project=@trimtrace -e '
            using Pkg
            Pkg.add(url = "https://github.com/BjarkeHautop/TrimTrace.jl")
            Pkg.develop(path = ".")'
      - name: Instantiate the test environment
        run: julia --project=test -e 'using Pkg; Pkg.instantiate()'
      - name: Record the tests and check the calls with --trim=safe
        run: |
          julia --project=@trimtrace -e '
            using TrimTrace, CausalStructures
            allow = isfile("test/trim-allow.txt") ? "test/trim-allow.txt" : String[]
            result = record_and_check(CausalStructures; allow)
            display(result)
            passed(result) || exit(1)'

  trim-check:
    name: Allowlisted calls under --trim=safe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.13"
      - uses: julia-actions/cache@v3
      - name: Compile trim-check/entry.jl with --trim=safe
        run: |
          julia -e '
            using Pkg
            Pkg.activate(; temp = true)
            Pkg.add(name = "JuliaC", version = "0.3")
            using JuliaC
            JuliaC.main(ARGS)
          ' -- \
            --output-lib "$RUNNER_TEMP/trimcheck" \
            --project trim-check \
            --trim=safe \
            --experimental \
            --compile-ccallable \
            --verbose \
            trim-check/entry.jl
      - name: Run the compiled trim_check_run()
        run: |
          gcc trim-check/run.c -o "$RUNNER_TEMP/run-trim-check" -ldl
          "$RUNNER_TEMP/run-trim-check" "$RUNNER_TEMP/trimcheck.so"
